    <g class="icon" transform="translate(611 675)">
      <path d="M2 40 H47 M7 32 L19 19 L27 26 L43 8"/>
      <path d="M31 8 H43 V20"/>
    </g>
    <circle cx="633" cy="908" r="35" fill="#f1f6f2"/>
    <g class="icon" transform="translate(610 887)">
      <path d="M5 3 H30 L40 13 V42 H5 Z"/>
      <path d="M30 3 V13 H40 M13 21 H31 M13 29 H23 M24 35 H43 M36 29 L43 35 L36 41"/>
    </g>
  </g>
</svg>
