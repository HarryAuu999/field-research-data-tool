      <circle cx="25" cy="20" r="1.4" fill="#668478" stroke="none"/>
      <circle cx="35" cy="20" r="1.4" fill="#668478" stroke="none"/>
    </g>
    <circle cx="633" cy="484" r="35" fill="#f1f6f2"/>
    <g class="icon" transform="translate(615 463)">
      <rect x="3" y="6" width="34" height="40" rx="5"/>
      <path d="M13 6 V3 H27 V6 M12 18 H28 M12 27 H28 M12 36 H23"/>
