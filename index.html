<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AuNote" />
    <meta name="description" content="AuNote 离线用户研究记录与导出工具" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/App-icon2.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>AuNote</title>
  </head>
  <body>
    <div id="update-dialog" class="dialog-overlay update-dialog" hidden>
      <section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="update-title" aria-describedby="update-summary">
        <div class="dialog-copy">
          <h2 id="update-title">发现新版本</h2>
          <p id="update-summary">本次更新包含功能改进和问题修复。</p>
        </div>
        <div class="update-actions">
          <button id="update-skip" class="dialog-quiet" type="button">跳过此版本</button>
          <button id="update-later" class="dialog-cancel" type="button">此次不更新</button>
          <button id="update-button" class="dialog-primary" type="button">立即更新</button>
        </div>
      </section>
    </div>
    <main id="app" aria-live="polite">
      <div class="loading-screen">
        <div class="loading-mark" aria-hidden="true"></div>
        <p>正在打开 AuNote…</p>
      </div>
    </main>
    <div id="confirm-overlay" class="dialog-overlay" hidden>
      <section class="dialog-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
        <div class="dialog-copy">
          <h2 id="confirm-title">确认操作</h2>
          <p id="confirm-message"></p>
        </div>
        <div class="dialog-actions">
          <button id="confirm-cancel" class="dialog-cancel" type="button">取消</button>
          <button id="confirm-submit" class="dialog-confirm" type="button">确认</button>
        </div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <input id="template-file-input" type="file" accept=".json,application/json" hidden />
    <input id="backup-file-input" type="file" accept=".json,application/json" hidden />
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
